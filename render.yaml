services:
  - type: web
    name: poster
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: poster-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: poster-db
    databaseName: poster
    user: poster
    plan: free